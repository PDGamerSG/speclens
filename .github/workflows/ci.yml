name: SpecLens checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: ./scripts/check.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
  postgres:
    # The store, budget and job claims also run on Postgres, as they do on Render.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: speclens
          POSTGRES_DB: speclens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPECLENS_TEST_DATABASE_URL: postgresql://postgres:speclens@localhost:5432/speclens_test
      MODEL_API_KEY: ''
      DEMO_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q --tb=short tests/test_store_db.py tests/test_budget.py tests/test_jobs.py
